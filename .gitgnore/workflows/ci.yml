name: CI - index.html

on:
  push:
    branches: [ main ]
    
  pull_request:
    branches: [ main ]
     
jobs:
  build-test:
    runs-on: ubuntu-latest
  
    steps:
      - name: Baixar código do repositório<br/>
        uses: actions/checkout@v4
    
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
 
      - name: Instalar dependências
        run: npm install
    
      - name: Rodar testes
        run: npm test

      - name: Build
        run: npm run build
